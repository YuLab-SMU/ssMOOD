<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <!-- Google Fonts / jsDelivr stylesheets removed: they block first paint in mainland China, and Roboto / MDI icons are unused -->
    <!--  <script src="./ace.js"></script> -->
    <!-- Include Plotly in public/index.html -->
    <!--  <script src="./plotly-latest.min.js"></script> -->
    <style>
        html, body {
            overflow-y: hidden; /* Hide vertical scrollbar */
            height: 100%; /* Make the page fill the full viewport height */
            width: 100%; /* Make the page fill the full viewport width */
            margin: 0; /* Remove default margin */
            padding: 0; /* Remove default padding */
        }
    </style>

  </head>
  <body>
  <!-- Startup loading screen: shown until Vue mounts, then faded out by main.js -->
  <div id="app-loading" role="status" aria-live="polite">
    <canvas id="app-loading-canvas" aria-hidden="true"></canvas>
    <div class="loading-ui">
      <div class="loading-logo-row">
        <!-- Logo mark: brain outline + cell network (dark-background variant) -->
        <svg width="52" height="52" viewBox="0 0 56 56" aria-hidden="true">
          <path d="M10 30 C8 20,12 10,20 7 C26 4,34 4,40 8 C47 13,50 20,48 28 C46 35,42 40,38 43 C34 46,30 47,28 47 C26 47,22 46,18 43 C13 39,11 36,10 30Z" fill="none" stroke="#c8daf2" stroke-width="1.2" opacity="0.45"/>
          <path d="M20 22 C24 18,30 19,34 16" fill="none" stroke="#c8daf2" stroke-width="0.9" opacity="0.25"/>
          <path d="M16 32 C20 28,26 30,32 27" fill="none" stroke="#c8daf2" stroke-width="0.9" opacity="0.2"/>
          <line x1="19" y1="19" x2="36" y2="16" stroke="#8caad2" stroke-width="0.9" opacity="0.5"/>
          <line x1="36" y1="16" x2="41" y2="30" stroke="#8caad2" stroke-width="0.9" opacity="0.4"/>
          <line x1="19" y1="19" x2="16" y2="35" stroke="#8caad2" stroke-width="0.9" opacity="0.4"/>
          <line x1="16" y1="35" x2="28" y2="42" stroke="#5aab8a" stroke-width="0.9" opacity="0.45"/>
          <line x1="41" y1="30" x2="28" y2="42" stroke="#e8825a" stroke-width="0.9" opacity="0.4"/>
          <line x1="30" y1="26" x2="19" y2="19" stroke="#9c8ad8" stroke-width="0.9" opacity="0.4"/>
          <line x1="30" y1="26" x2="41" y2="30" stroke="#9c8ad8" stroke-width="0.9" opacity="0.4"/>
          <circle cx="19" cy="19" r="5.5" fill="#7e9bd0" opacity="0.25"/>
          <circle cx="19" cy="19" r="3.2" fill="#7e9bd0"/>
          <circle cx="36" cy="16" r="2.6" fill="#a9c2e6"/>
          <circle cx="41" cy="30" r="4.8" fill="#e8825a" opacity="0.22"/>
          <circle cx="41" cy="30" r="2.8" fill="#e8825a"/>
          <circle cx="28" cy="42" r="2.4" fill="#5aab8a"/>
          <circle cx="16" cy="35" r="2.0" fill="#7fc4a6"/>
          <circle cx="30" cy="26" r="2.2" fill="#9c8ad8"/>
        </svg>
        <div class="loading-wordmark">ss<strong>MOOD</strong></div>
      </div>
      <div class="loading-sub">Spatial &amp; Single-cell · Major Depression Omics</div>
      <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
      <div class="loading-hint">Initial load may take longer on first use.<br>This may take a few seconds…</div>
    </div>
  </div>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
    <script>
    // Loading-screen background: a slowly drifting cell network using the UMAP cell-type palette
    (function () {
      var canvas = document.getElementById('app-loading-canvas');
      if (!canvas || !canvas.getContext) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var ctx = canvas.getContext('2d');
      var COLORS = [[126,155,208],[169,194,230],[90,171,138],[127,196,166],[232,130,90],[156,138,216]];
      var W, H, dpr, dots = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function build() {
        dots = [];
        var n = Math.min(Math.round(W * H / 16000), 70);
        for (var i = 0; i < n; i++) {
          dots.push({
            x: Math.random() * W, y: Math.random() * H,
            vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
            r: 1.2 + Math.random() * 2, op: 0.35 + Math.random() * 0.5,
            ph: Math.random() * 6.28, c: COLORS[i % COLORS.length]
          });
        }
      }
      function frame(ts) {
        var el = document.getElementById('app-loading');
        if (!el || el.style.display === 'none') return; // stop animating once the loading screen is gone
        ctx.clearRect(0, 0, W, H);
        var i, j, a, b, dx, dy, d;
        for (i = 0; i < dots.length; i++) {
          a = dots[i];
          a.x += a.vx; a.y += a.vy;
          if (a.x < 0) a.x = W; if (a.x > W) a.x = 0;
          if (a.y < 0) a.y = H; if (a.y > H) a.y = 0;
        }
        ctx.lineWidth = 0.7;
        for (i = 0; i < dots.length; i++) {
          a = dots[i];
          for (j = i + 1; j < dots.length; j++) {
            b = dots[j]; dx = a.x - b.x; dy = a.y - b.y;
            d = Math.sqrt(dx * dx + dy * dy);
            if (d > 140) continue;
            ctx.strokeStyle = 'rgba(' + a.c[0] + ',' + a.c[1] + ',' + a.c[2] + ',' + ((1 - d / 140) * 0.18) + ')';
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        for (i = 0; i < dots.length; i++) {
          a = dots[i];
          var pulse = 0.85 + 0.15 * Math.sin(ts / 900 + a.ph);
          ctx.fillStyle = 'rgba(' + a.c[0] + ',' + a.c[1] + ',' + a.c[2] + ',' + (a.op * 0.18) + ')';
          ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 5, 0, 6.2832); ctx.fill();
          ctx.fillStyle = 'rgba(' + a.c[0] + ',' + a.c[1] + ',' + a.c[2] + ',' + a.op + ')';
          ctx.beginPath(); ctx.arc(a.x, a.y, a.r * pulse, 0, 6.2832); ctx.fill();
        }
        requestAnimationFrame(frame);
      }
      resize(); build();
      window.addEventListener('resize', function () { resize(); build(); });
      requestAnimationFrame(frame);
    })();
    </script>
  </body>
  <style>
#app-loading {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(ellipse at 50% 40%, #1d3558 0%, #162844 45%, #0b1626 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  transition: opacity .5s ease, visibility .5s ease;
}
#app-loading.done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
#app-loading-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.loading-ui {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 24px;
  text-align: center;
}
.loading-logo-row {
  display: flex;
  align-items: center;
  gap: 14px;
  opacity: 0;
  transform: translateY(8px);
  animation: loadingFadeUp .6s cubic-bezier(.22,1,.36,1) forwards .1s;
}
.loading-wordmark {
  font-size: 46px;
  font-weight: 200;
  letter-spacing: -1px;
  color: rgba(222,234,252,.95);
}
.loading-wordmark strong { font-weight: 700; }
.loading-sub {
  margin-top: 14px;
  font-size: 11px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: rgba(160,190,225,.7);
  opacity: 0;
  animation: loadingFadeUp .6s ease forwards .3s;
}
.loading-bar-wrap {
  position: relative;
  width: 220px;
  height: 2px;
  margin-top: 28px;
  overflow: hidden;
  border-radius: 2px;
  background: rgba(126,155,208,.18);
  opacity: 0;
  animation: loadingFadeUp .4s ease forwards .4s;
}
/* Indeterminate progress: a gradient highlight sweeps across the track */
.loading-bar {
  position: absolute;
  top: 0; bottom: 0;
  width: 40%;
  background: linear-gradient(90deg, transparent, #7e9bd0, #5aab8a, transparent);
  animation: loadingSweep 1.4s ease-in-out infinite;
}
.loading-hint {
  margin-top: 22px;
  max-width: 360px;
  font-size: 12px;
  line-height: 1.6;
  color: rgba(160,190,225,.55);
  opacity: 0;
  animation: loadingFadeUp .6s ease forwards 1.2s;
}
@keyframes loadingFadeUp { to { opacity: 1; transform: translateY(0); } }
@keyframes loadingSweep {
  from { left: -40%; }
  to   { left: 100%; }
}
@media (max-width: 480px) {
  .loading-wordmark { font-size: 36px; }
  .loading-sub { font-size: 10px; letter-spacing: .14em; line-height: 1.7; }
}
@media (prefers-reduced-motion: reduce) {
  .loading-logo-row, .loading-sub, .loading-bar-wrap, .loading-hint { animation: none; opacity: 1; transform: none; }
  .loading-bar { animation: none; left: 30%; }
}

</style>

</html>
